name: Daily Security Job Scraper

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Needed to commit teamblind_cache.json and index.html back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 jinja2

      - name: Run Job Scraper Script
        run: python job_fetcher.py

      - name: Commit and Push Cache & Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage updated cache and generated dashboard
          git add teamblind_cache.json index.html
          
          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "chore: update job dashboard and teamblind cache [skip ci]"
          git push
