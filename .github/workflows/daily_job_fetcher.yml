name: Daily Security Job Scraper

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Needed to commit cache to main and publish to gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore existing Pages archive
        run: |
          mkdir -p archive
          git fetch origin gh-pages --depth=1
          if git cat-file -e origin/gh-pages:archive 2>/dev/null; then
            git checkout origin/gh-pages -- archive
            git restore --staged archive || git reset HEAD -- archive
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 jinja2

      - name: Run Job Scraper Script
        run: python job_fetcher.py

      - name: Commit cache to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add teamblind_cache.json teamblind_failed.json
          git diff --staged --quiet || git commit -m "chore: update teamblind cache [skip ci]"
          git push

      - name: Prepare GitHub Pages payload
        run: |
          mkdir -p pages_publish/archive
          cp index.html pages_publish/index.html
          if [ -d archive ]; then
            cp -R archive/. pages_publish/archive/
          fi
          touch pages_publish/.nojekyll

      - name: Deploy dashboard to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_publish
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: update job dashboard'
